<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#d8dee4" stroke-width="2"/>

  <!-- Branch graph icon, scaled large -->
  <g transform="translate(140, 220) scale(10)">
    <line x1="6" y1="7" x2="6" y2="17" stroke="#1f883d" stroke-width="2" stroke-linecap="round"/>
    <line x1="6" y1="12" x2="16" y2="12" stroke="#1f883d" stroke-width="2" stroke-linecap="round"/>
    <circle cx="6" cy="6" r="2.5" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
    <circle cx="6" cy="18" r="2.5" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
    <circle cx="18" cy="12" r="2.5" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
  </g>

  <!-- Title -->
  <text x="400" y="295" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="100" font-weight="700" fill="#1f2328">JSS Git</text>

  <!-- Subtitle -->
  <text x="400" y="370" font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif" font-size="44" fill="#656d76">git on a Solid pod</text>

  <!-- URL at bottom -->
  <text x="600" y="570" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#0969da" text-anchor="middle">jss.live/git/</text>
</svg>
