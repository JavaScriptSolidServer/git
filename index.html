<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSS Git</title>
  <meta name="description" content="Browse git repositories hosted on Solid pods. Open source, no-build Preact + isomorphic-git web app.">

  <!-- Open Graph -->
  <meta property="og:title" content="JSS Git — git on a Solid pod">
  <meta property="og:description" content="Browse git repositories hosted on Solid pods. Open source, no-build Preact + isomorphic-git web app.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jss.live/git/">
  <meta property="og:image" content="https://jss.live/git/og-image.png">
  <meta property="og:image:width" content="1200">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JSS Git — git on a Solid pod">
  <meta name="twitter:description" content="Browse git repositories hosted on Solid pods.">
  <meta name="twitter:image" content="https://jss.live/git/og-image.png">

  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cline%20x1%3D%226%22%20y1%3D%227%22%20x2%3D%226%22%20y2%3D%2217%22%20stroke%3D%22%231f883d%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Cline%20x1%3D%226%22%20y1%3D%2212%22%20x2%3D%2216%22%20y2%3D%2212%22%20stroke%3D%22%231f883d%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%226%22%20cy%3D%226%22%20r%3D%222.5%22%20fill%3D%22%23fff%22%20stroke%3D%22%231f883d%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%226%22%20cy%3D%2218%22%20r%3D%222.5%22%20fill%3D%22%23fff%22%20stroke%3D%22%231f883d%22%20stroke-width%3D%222%22%2F%3E%3Ccircle%20cx%3D%2218%22%20cy%3D%2212%22%20r%3D%222.5%22%20fill%3D%22%23fff%22%20stroke%3D%22%231f883d%22%20stroke-width%3D%222%22%2F%3E%3C%2Fsvg%3E">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1f2328;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
    input[type=url] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1rem;
      background: #1f883d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #1a7f37; }
    .form-row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .form-row input { flex: 1; }
    .file-list, .ref-list {
      list-style: none; padding: 0;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      margin: 0;
    }
    .file-list li, .ref-list li {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #d0d7de;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.85rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .file-list li:last-child, .ref-list li:last-child { border-bottom: none; }
    .file-icon { color: #656d76; width: 1.2em; }
    .ref-list li { justify-content: space-between; }
    .oid { color: #656d76; }
    .error {
      padding: 0.75rem;
      background: #ffebe9;
      border: 1px solid #ffc1ba;
      border-radius: 6px;
      color: #82071e;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .loading { color: #656d76; font-style: italic; }
    .meta { color: #656d76; font-size: 0.85rem; }
    a { color: #0969da; }
    .readme {
      margin-top: 0.5rem;
      padding: 1.5rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
    }
    .readme h1 { font-size: 1.5rem; border-bottom: 1px solid #d8dee4; padding-bottom: 0.3em; margin-top: 0; }
    .readme h2 { font-size: 1.25rem; border-bottom: 1px solid #d8dee4; padding-bottom: 0.3em; }
    .readme code {
      padding: 0.2em 0.4em;
      background: rgba(175,184,193,0.2);
      border-radius: 6px;
      font-size: 85%;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .readme pre {
      padding: 16px;
      background: #f6f8fa;
      border-radius: 6px;
      overflow-x: auto;
    }
    .readme pre code { padding: 0; background: none; font-size: 85%; }
    .readme img { max-width: 100%; height: auto; vertical-align: middle; margin-right: 0.25rem; }
    details summary { cursor: pointer; user-select: none; padding: 0.5rem 0; color: #656d76; font-size: 0.9rem; }
    .file-list a { text-decoration: none; }
    .file-list a:hover { text-decoration: underline; }
    .breadcrumb { margin: 1rem 0; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .breadcrumb .separator { color: #afb8c1; }
    .breadcrumb .path { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #1f2328; }
    .file-content {
      margin-top: 0.5rem;
      padding: 1rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      overflow-x: auto;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.85rem;
      white-space: pre;
      line-height: 1.5;
    }
    .file-content code { background: none; padding: 0; font-family: inherit; }
    .file-content.image { background: #fff; text-align: center; padding: 1.5rem; }
    .file-content.image img { max-width: 100%; height: auto; }
    .tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid #d0d7de; margin: 1rem 0 0; }
    .tab {
      padding: 0.5rem 0.875rem;
      text-decoration: none;
      color: #1f2328;
      font-size: 0.9rem;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      margin-bottom: -1px;
    }
    .tab:hover { background: #f6f8fa; }
    .tab.active { background: #fff; border-color: #d0d7de; font-weight: 600; }
    .commit-list { list-style: none; padding: 0; border: 1px solid #d0d7de; border-radius: 6px; margin: 1rem 0 0; }
    .commit { padding: 0.75rem 1rem; border-bottom: 1px solid #d0d7de; }
    .commit:last-child { border-bottom: none; }
    .commit-message { font-weight: 500; margin-bottom: 0.25rem; }
    .commit-meta { color: #656d76; font-size: 0.85rem; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
    .commit-author { color: #1f2328; }
    .commit-clickable { cursor: pointer; }
    .commit-clickable:hover { background: #f6f8fa; }
    .commit-detail {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
    }
    .commit-detail-message {
      white-space: pre-wrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0 0 0.75rem;
      font-size: 0.95rem;
      color: #1f2328;
    }
    .commit-detail-meta { margin: 0.25rem 0; font-size: 0.85rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .change-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .change-added { background: #dafbe1; color: #1a7f37; }
    .change-modified { background: #fff8c5; color: #9a6700; }
    .change-deleted { background: #ffebe9; color: #cf222e; }
    .path-segment { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.85rem; }
    .repo-header {
      margin: 1.5rem 0 0;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #d8dee4;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .repo-breadcrumb { font-size: 1.1rem; display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .repo-breadcrumb .owner { color: #0969da; }
    .repo-breadcrumb .separator { color: #afb8c1; }
    .repo-breadcrumb .repo-name { color: #1f2328; font-weight: 600; }
    .visibility-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border: 1px solid #d0d7de;
      border-radius: 12px;
      color: #656d76;
      margin-left: 0.5rem;
    }
    .branch-select {
      padding: 0.3rem 0.6rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .repo-actions {
      display: inline-flex;
      gap: 0.4rem;
      margin-left: auto;
      flex-wrap: wrap;
    }
    .repo-action {
      padding: 0.3rem 0.7rem;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #1f2328;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: inherit;
    }
    .repo-action:hover { background: #f3f4f6; }
    .repo-action .count {
      padding: 1px 6px;
      background: #eaeef2;
      border-radius: 10px;
      font-size: 0.72rem;
      color: #1f2328;
      font-weight: 600;
    }
    .latest-commit {
      margin: 0.75rem 0 0;
      padding: 0.625rem 1rem;
      border: 1px solid #d0d7de;
      border-radius: 6px 6px 0 0;
      background: #f6f8fa;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      font-size: 0.85rem;
    }
    .latest-commit + .file-list { border-top-left-radius: 0; border-top-right-radius: 0; border-top: none; margin-top: 0; }
    .latest-commit .commit-msg { color: #1f2328; flex: 1; min-width: 0; }
    .latest-commit .commit-author { font-weight: 600; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 2rem;
      margin-top: 1rem;
      align-items: start;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
    }
    .main { min-width: 0; }
    .sidebar { font-size: 0.85rem; color: #656d76; }
    .sidebar h3 {
      font-size: 1rem; color: #1f2328; margin: 0 0 0.5rem;
      padding-bottom: 0.3rem; border-bottom: 1px solid #d8dee4;
    }
    .sidebar-desc { margin: 0 0 0.75rem; color: #1f2328; }
    .sidebar-link a { word-break: break-all; font-size: 0.8rem; }
    .sidebar-stats { list-style: none; padding: 0; margin: 1rem 0 0; }
    .sidebar-stats li {
      padding: 0.4rem 0;
      border-top: 1px solid #d8dee4;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .sidebar-stats .stat-label { color: #656d76; }
    .sidebar-stats code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.8rem;
      background: #eaeef2;
      padding: 1px 6px;
      border-radius: 3px;
      color: #1f2328;
    }
    .clone-box {
      display: flex;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #f6f8fa;
      overflow: hidden;
    }
    .clone-url {
      flex: 1;
      border: none;
      padding: 0.4rem 0.6rem;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.75rem;
      background: transparent;
      color: #1f2328;
      min-width: 0;
      outline: none;
    }
    .copy-btn {
      border: none;
      border-left: 1px solid #d0d7de;
      background: transparent;
      padding: 0.4rem 0.6rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: #656d76;
    }
    .copy-btn:hover { background: #eaeef2; color: #1f2328; }
    .tag-list { list-style: none; padding: 0; margin: 0; }
    .tag-list li { padding: 0.25rem 0; font-size: 0.8rem; }
    .top-bar {
      margin: 0 0 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .top-bar .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-decoration: none;
      color: #1f2328;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .top-bar .brand:hover { color: #1f883d; }
    .top-bar .brand svg { display: block; }
    .brand-tagline {
      color: #656d76;
      font-size: 0.8rem;
      border-left: 1px solid #d0d7de;
      padding-left: 0.6rem;
    }
    .form-compact .form-row input { font-size: 0.8rem; padding: 0.35rem 0.6rem; }
    .form-compact .form-row button { padding: 0.35rem 0.75rem; font-size: 0.8rem; }
    .footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #d8dee4; text-align: center; }
    .repo-link { text-decoration: none; color: #0969da; }
    .repo-link:hover { text-decoration: underline; }
    .file-meta { margin: 1rem 0 0.5rem; }
    /* Prism syntax highlighting (GitHub-like) */
    .token.comment, .token.prolog, .token.doctype, .token.cdata { color: #6a737d; font-style: italic; }
    .token.punctuation { color: #24292e; }
    .token.namespace { opacity: 0.7; }
    .token.property, .token.tag, .token.constant, .token.symbol, .token.deleted { color: #22863a; }
    .token.boolean, .token.number { color: #005cc5; }
    .token.selector, .token.attr-name, .token.string, .token.char, .token.builtin, .token.inserted { color: #032f62; }
    .token.operator, .token.entity, .token.url { color: #005cc5; }
    .token.atrule, .token.attr-value, .token.keyword { color: #d73a49; }
    .token.function, .token.class-name { color: #6f42c1; }
    .token.regex, .token.important, .token.variable { color: #e36209; }
    .token.important, .token.bold { font-weight: bold; }
    .token.italic { font-style: italic; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
