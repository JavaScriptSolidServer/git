<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSS Git</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #1f2328;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.1rem; margin: 1.5rem 0 0.5rem; }
    input[type=url] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.5rem 1rem;
      background: #1f883d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #1a7f37; }
    .form-row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .form-row input { flex: 1; }
    .file-list, .ref-list {
      list-style: none; padding: 0;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      margin: 0;
    }
    .file-list li, .ref-list li {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #d0d7de;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 0.85rem;
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .file-list li:last-child, .ref-list li:last-child { border-bottom: none; }
    .file-icon { color: #656d76; width: 1.2em; }
    .ref-list li { justify-content: space-between; }
    .oid { color: #656d76; }
    .error {
      padding: 0.75rem;
      background: #ffebe9;
      border: 1px solid #ffc1ba;
      border-radius: 6px;
      color: #82071e;
      margin: 1rem 0;
      font-size: 0.9rem;
    }
    .loading { color: #656d76; font-style: italic; }
    .meta { color: #656d76; font-size: 0.85rem; }
    a { color: #0969da; }
    .readme {
      margin-top: 0.5rem;
      padding: 1.5rem;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      background: #fff;
    }
    .readme h1 { font-size: 1.5rem; border-bottom: 1px solid #d8dee4; padding-bottom: 0.3em; margin-top: 0; }
    .readme h2 { font-size: 1.25rem; border-bottom: 1px solid #d8dee4; padding-bottom: 0.3em; }
    .readme code {
      padding: 0.2em 0.4em;
      background: rgba(175,184,193,0.2);
      border-radius: 6px;
      font-size: 85%;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .readme pre {
      padding: 16px;
      background: #f6f8fa;
      border-radius: 6px;
      overflow-x: auto;
    }
    .readme pre code { padding: 0; background: none; font-size: 85%; }
    details summary { cursor: pointer; user-select: none; padding: 0.5rem 0; color: #656d76; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
